<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#213e34">
  <meta name="description" content="絵をタッチして、オランダ語の発音を聞く子ども向け図鑑です。">
  <title>オランダ語 タッチずかん</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap heading">
      <div>
        <p class="subject">🇳🇱 オランダ語</p>
        <h1>タッチずかん</h1>
        <p class="intro">えを タッチして、ことばを きいてみよう。</p>
      </div>
      <div class="cover" aria-hidden="true">📖</div>
    </div>
  </header>
  <main class="wrap">
    <nav class="categories" aria-label="ずかんの しゅるい">
      <button type="button" data-category="animals" aria-pressed="true"><span aria-hidden="true">🐾</span> どうぶつ</button>
      <button type="button" data-category="food" aria-pressed="false"><span aria-hidden="true">🍎</span> たべもの</button>
      <button type="button" data-category="vehicles" aria-pressed="false"><span aria-hidden="true">🚲</span> のりもの</button>
    </nav>
    <p id="status" role="status" hidden></p>
    <noscript><p>図鑑を使うには JavaScript を有効にしてください。</p></noscript>
    <ul class="cards" id="cards" aria-label="どうぶつ"></ul>
  </main>
</body>
</html>
