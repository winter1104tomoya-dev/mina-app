<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174e41">
<meta name="apple-mobile-web-app-title" content="こいんのおみせ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>こいんのおみせ</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #e4f7e9; color: #173f35; font-family: system-ui, sans-serif; text-align: center; }
header { background: #174e41; color: white; }
.bar { max-width: 540px; margin: auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: clamp(1.15rem, 5vw, 1.55rem); margin: 0; }
main { max-width: 540px; margin: auto; padding: 16px; }
.progress { min-height: 24px; margin: 0 0 10px; font-weight: bold; }
.item { background: #fffdf0; border: 3px solid #174e41; border-radius: 26px; box-shadow: 0 5px #174e41; padding: 12px; }
.picture { width: clamp(4rem, 22vw, 6rem); aspect-ratio: 1; margin: auto; background: url('./goods.png') no-repeat; background-size: 800% 100%; }
h2 { margin: 4px 0; font-size: 1.6rem; }
.price { display: flex; justify-content: center; gap: 6px; align-items: center; font-weight: bold; margin: 8px 0 2px; }
.coin-face { display: inline-grid; place-items: center; align-content: center; gap: 1px; inline-size: 100%; aspect-ratio: 1; border: 2px solid #78848a; border-radius: 50%; background: linear-gradient(145deg, #fafcfc, #bbc6cd); color: #26363d; box-shadow: inset 0 0 0 2px #ffffff70; line-height: 1; font-weight: bold; }
.coin-face[data-value="5"] { position: relative; border-color: #96732c; background: radial-gradient(circle at center, transparent 15%, #96732c 16%, #e5c375 20%, #e5c375 60%, #cba24c 100%); color: #49350b; }
.coin-face[data-value="50"] { position: relative; background: radial-gradient(circle, transparent 14%, #78848a 15%, #e1e7eb 19%, #c3cdd3 70%); }
.coin-face:is([data-value="5"], [data-value="50"]) > span {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: .9em;
}
.coin-face[data-value="5"] > span { top: 64%; }
.coin-face[data-value="50"] > span { bottom: 64%; }
.coin-face[data-value="10"] { border-color: #914e32; background: linear-gradient(145deg, #f4bc99, #c17b59); color: #43261c; }
.coin-face[data-value="500"] { border-color: #96732c; background: linear-gradient(145deg, #f5dd9b, #c39e51); color: #49350b; }
.mini { inline-size: 32px; font-size: .75rem; }
.mini:is([data-value="5"], [data-value="50"]) { font-size: .5625rem; }
button { font: inherit; font-weight: bold; border: 2px solid transparent; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #4c34a3; outline-offset: 3px; }
.listen { border-color: #9fe0bf; background: #fff; color: #174e41; border-radius: 14px; min-height: 44px; padding: 4px 10px; }
.wallet { margin-top: 16px; }
.tray { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 5px; background: #c6ead3; border-radius: 14px; }
.controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 10px; }
.coins { display: grid; grid-template-columns: repeat(6, minmax(0, 68px)); justify-content: center; gap: 3px; margin-top: 10px; }
.coin { display: grid; place-items: center; min-height: 48px; padding: 1px; background: transparent; border-radius: 12px; }
.coin .coin-face { max-width: var(--diameter); font-size: clamp(.8rem, 4vw, 1.15rem); }
.action { background: #174e41; color: white; border-radius: 15px; padding: 13px 18px; min-height: 50px; }
.undo { background: white; color: #174e41; border-color: #174e41; border-radius: 14px; min-height: 48px; padding: 4px 9px; }
button:disabled { opacity: .48; cursor: default; }
.status { min-height: 2.6em; margin: 12px 0 0; font-weight: bold; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="bar"><h1>こいんのおみせ</h1><button class="listen" id="listen" type="button">きく</button></div></header>
<main>
  <p class="progress" id="progress"></p>
  <section class="item" aria-labelledby="name">
    <div class="picture" id="picture" aria-hidden="true"></div>
    <h2 id="name"></h2>
    <div class="price" id="price"></div>
  </section>
  <section class="wallet" id="wallet" aria-label="おしはらい">
    <div class="tray" id="tray" role="group"></div>
    <div class="coins" id="coins" role="group" aria-label="えらべる こうか"></div>
    <div class="controls">
      <button class="undo" id="undo" type="button">もどす</button>
      <button class="action" id="pay" type="button">はらう</button>
    </div>
  </section>
  <p class="status" id="status" role="status"></p>
  <button class="action" id="next" type="button" hidden></button>
</main>
<script>
const goods = ['りんご', 'ぱん', 'いちご', 'みかん', 'ばなな', 'あめ', 'おにぎり', 'ぬいぐるみ'];
const prices = [1, 2, 3, 5, 6, 10, 11, 15, 20, 50, 55, 100, 110, 150, 500];
const denominations = [
  { value: 1, diameter: 44 },
  { value: 5, diameter: 49 },
  { value: 10, diameter: 52 },
  { value: 50, diameter: 46 },
  { value: 100, diameter: 50 },
  { value: 500, diameter: 58 }
];
const elements = Object.fromEntries(
  ['progress', 'name', 'picture', 'price', 'wallet', 'tray', 'undo', 'coins', 'pay', 'status', 'next', 'listen']
    .map(id => [id, document.getElementById(id)])
);
let questions = makeQuestions();
let round = 0;
const coins = [];
let phase = 'shopping';

function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function makeQuestions() {
  const pictures = goods.map((_, index) => index);
  return shuffle(prices.flatMap(price =>
    shuffle(pictures).slice(0, 2).map(picture => ({ picture, price }))
  ));
}

function speech(message) {
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = 'ja-JP';
  utterance.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

function coinFace(coin, miniature = false) {
  const token = document.createElement('span');
  token.className = miniature ? 'coin-face mini' : 'coin-face';
  token.dataset.value = coin.value;
  token.setAttribute('aria-hidden', 'true');
  const label = document.createElement('span');
  label.textContent = coin.value;
  token.append(label);
  return token;
}

function total() {
  return coins.reduce((sum, coin) => sum + coin.value, 0);
}

const coinButtons = denominations.map(coin => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'coin';
  button.style.setProperty('--diameter', coin.diameter + 'px');
  button.setAttribute('aria-label', coin.value + 'えんを いれる');
  button.append(coinFace(coin));
  button.addEventListener('click', () => {
    coins.push(coin);
    showCoins();
    elements.status.textContent = total() + 'えん はいったよ';
  });
  elements.coins.append(button);
  return button;
});

function priceCoins(price) {
  const hint = [];
  let remaining = price;
  for (const coin of [...denominations].reverse()) {
    const count = Math.floor(remaining / coin.value);
    hint.push(...Array(count).fill(coin));
    remaining %= coin.value;
  }
  return hint;
}

function showProgress(bought) {
  elements.progress.textContent = questions.length + 'このうち ' + bought + 'こ かえたよ';
}

function showCoins() {
  elements.tray.replaceChildren(...coins.map(coin => coinFace(coin, true)), total() + 'えん');
  elements.tray.setAttribute('aria-label', 'いれた おかね ' + total() + 'えん');
  elements.undo.disabled = coins.length === 0;
  // Enough room to pay any price entirely in 1-yen coins.
  coinButtons.forEach(button => { button.disabled = coins.length >= Math.max(...prices); });
}

function showRound() {
  const item = questions[round];
  phase = 'shopping';
  coins.length = 0;
  showProgress(round);
  elements.picture.style.backgroundPositionX = (100 * item.picture / (goods.length - 1)) + '%';
  elements.name.textContent = goods[item.picture];
  elements.price.replaceChildren(...priceCoins(item.price).map(coin => coinFace(coin, true)), item.price + 'えん');
  elements.status.textContent = 'おなじ きんがくに なるように いれてね';
  elements.wallet.hidden = false;
  elements.next.hidden = true;
  showCoins();
}

function promptForItem() {
  const item = questions[round];
  return goods[item.picture] + 'は、' + item.price + '円です。おなじ金額になるように入れてね。';
}

elements.listen.hidden = !('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window);
elements.listen.addEventListener('click', () => speech(phase === 'shopping' ? promptForItem() : elements.status.textContent));
elements.undo.addEventListener('click', () => {
  coins.pop();
  showCoins();
  elements.status.textContent = total() + 'えん のこったよ';
});
elements.pay.addEventListener('click', () => {
  const item = questions[round];
  if (total() !== item.price) {
    elements.status.textContent = total() < item.price ? 'もうすこし いれてみよう' : 'もどす を おしてみよう';
  } else {
    phase = 'bought';
    const finished = round === questions.length - 1;
    showProgress(round + 1);
    elements.status.textContent = finished ? 'ぜんぶ かえたよ！' : goods[item.picture] + 'が かえたよ！';
    elements.wallet.hidden = true;
    elements.next.textContent = finished ? 'もういちど' : 'つぎの おかいもの';
    elements.next.hidden = false;
    elements.next.focus();
  }
  speech(elements.status.textContent);
});
elements.next.addEventListener('click', () => {
  round = (round + 1) % questions.length;
  if (round === 0) questions = makeQuestions();
  showRound();
  coinButtons[0].focus();
  speech(promptForItem());
});
showRound();
</script>
</body>
</html>
